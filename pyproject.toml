[project]
name = "pawsync-hass"
version = "0.1.0"
description = "Home Assistant custom integration for Pawsync pet feeders"
requires-python = ">=3.14.2"
license = "MIT"
dependencies = ["aiohttp"]

[project.optional-dependencies]
dev = [
    "homeassistant>=2026.8.0",
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
